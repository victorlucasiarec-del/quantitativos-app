<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'none'; worker-src 'self'; manifest-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f7d22">
<title>Quantitativos de Campo – CBTU</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--g:#4f7d22;--g2:#92d050;--bg:#f3f5f0;--card:#fff;--tx:#1f2420;--mu:#6b7368;--bd:#dfe4da;--red:#c0392b;--amb:#d68910}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header.top{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 10px;padding-top:max(10px,env(safe-area-inset-top))}
header.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:12px;opacity:.85;font-weight:400}
.ib{background:rgba(255,255,255,.15);border:0;color:#fff;font-size:20px;min-width:44px;height:44px;border-radius:10px;cursor:pointer}
main{padding:12px;padding-bottom:110px;max-width:820px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:12px;padding:0 14px;min-height:46px;font-size:15px;font-weight:600;cursor:pointer}
.btn.p{background:var(--g);border-color:var(--g);color:#fff}
.btn.d{color:var(--red);border-color:#f0c9c4}
.btn.sm{min-height:44px;min-width:44px;padding:0 10px;font-size:14px;border-radius:10px}
.btn.w{width:100%}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mu{color:var(--mu);font-size:13px}
h2{font-size:15px;margin:16px 4px 8px;color:var(--g);text-transform:uppercase;letter-spacing:.02em}
label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin:10px 0 4px}
input[type=text],input[type=date],textarea,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx)}
textarea{resize:vertical;min-height:70px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;min-height:32px;line-height:24px;border-radius:99px;border:0;cursor:pointer;white-space:nowrap}
.st-Pendente{background:#fdebd0;color:#7a4a05}.st-Levantado{background:#d6eaf8;color:#154360}.st-Revisado{background:#d5f5e3;color:#145a32}
.prog{height:8px;background:#e5e9e1;border-radius:99px;overflow:hidden;margin-top:8px}.prog>i{display:block;height:100%;background:var(--g2)}
.amb{display:flex;align-items:center;gap:10px;padding:12px 4px;border-top:1px solid var(--bd);cursor:pointer}
.amb:first-of-type{border-top:0}
.num{font-weight:800;color:var(--g);min-width:38px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin-bottom:12px;background:var(--bg);padding:4px 0}
.tabs a{flex:1;text-align:center;padding:10px 4px;border-radius:10px;background:#fff;border:1px solid var(--bd);text-decoration:none;color:var(--tx);font-weight:600;font-size:14px}
.tabs a.on{background:var(--g);color:#fff;border-color:var(--g)}
.item{border:2px solid var(--bd)}
.item.on{border-color:var(--g2);box-shadow:0 0 0 3px rgba(146,208,80,.25)}
.item textarea{border:0;padding:6px 2px;min-height:64px;font-size:16px;background:transparent}
.item textarea:focus{outline:none}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:pointer;background:#eee}
.thumbs .fig{position:relative}.thumbs .fig b{position:absolute;left:3px;top:3px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:1px 5px;border-radius:6px}
.tools{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tools .btn{min-height:40px;padding:0 10px;font-size:15px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--bd);display:flex;gap:8px;padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.bar .btn{flex:1;min-height:56px;font-size:16px;flex-direction:column;gap:0;line-height:1.1}
.bar .btn small{font-size:11px;font-weight:500;opacity:.85}
.rec{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.7}}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 10px;font-size:17px}
.sheet .opt{display:flex;align-items:center;gap:10px;padding:12px 4px;border-top:1px solid var(--bd);font-size:16px;cursor:pointer}
.sheet .opt input{width:22px;height:22px}
.photo-big{width:100%;max-height:52vh;object-fit:contain;background:#111;border-radius:10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw;text-align:center}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.warn{background:#fff4e0;border:1px solid #f5d49a;color:#7a5200;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.busy{position:fixed;inset:0;z-index:70;background:rgba(255,255,255,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:600}
.spin{width:38px;height:38px;border:4px solid #dfe4da;border-top-color:var(--g);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
#saveSt{font-size:11px;opacity:0;transition:opacity .3s;white-space:nowrap}#saveSt.on{opacity:.9}
:focus-visible{outline:3px solid #f5b041;outline-offset:2px}

.svc{padding:10px 12px}.svc .desc{font-size:15px;line-height:1.3}
.svc.st-exec{border-color:#f0b27a;box-shadow:0 0 0 2px rgba(240,178,122,.25)}.svc.st-ok,.svc.st-na{background:#f7f9f5}
.sts{display:flex;gap:6px;margin-top:8px}.stb{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--bd);background:#fff;font:inherit;font-weight:700;font-size:14px;color:var(--mu);cursor:pointer}
.stb.on.ok{background:#d5f5e3;border-color:#82e0aa;color:#145a32}.stb.on.na{background:#eaecee;border-color:#bfc9ca;color:#424949}.stb.on.exec{background:#fdebd0;border-color:#f0b27a;color:#7a4a05}
.meds{margin-top:10px;border-top:1px dashed var(--bd);padding-top:6px}.med{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f0f2ee;cursor:pointer}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.g2 label{margin-top:8px}
.res{margin-top:12px;padding:10px 12px;background:#f3f8ee;border:1px solid #cfe3bd;border-radius:10px;min-height:44px}
.chip.fon{background:var(--g);color:#fff}.chip{background:#eef1ea;color:var(--tx)}.chip[data-a=filtroSvc]{min-height:44px;padding:0 14px}
details>summary{cursor:pointer;list-style:none;min-height:32px}details>summary::-webkit-details-marker{display:none}details>summary::before{content:"▸ ";color:var(--g)}details[open]>summary::before{content:"▾ "}
input[inputmode=decimal]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx)}
</style>
</head>
<body>
<div id="app"><div style="max-width:520px;margin:18vh auto 0;padding:20px;text-align:center;color:#444">
<div style="font-size:18px;font-weight:700;color:#4f7d22;margin-bottom:10px">Quantitativos de Campo</div>
<div id="bootMsg">Carregando…</div>
<div style="margin-top:14px;font-size:14px;color:#666">Se esta mensagem não sumir em alguns segundos: conecte à internet e abra o app de novo para concluir a atualização. <b>Seus dados continuam guardados no aparelho.</b></div>
</div></div>
<input id="camIn" type="file" accept="image/*" capture="environment" class="hide">
<input id="galIn" type="file" accept="image/*" multiple class="hide">
<input id="bkIn" type="file" accept=".zip,application/zip" class="hide">
<input id="catIn" type="file" accept=".csv,text/csv" class="hide">
<script src="jszip.acc7e41455.js"></script>
<script src="app.32141e634b.js"></script>
</body>
</html>
